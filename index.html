<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Spájz & Raktár</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="spajzicon.png" />
</head>
<body class="bg-gray-50 text-gray-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('inventory');
            
            // Spájz tételek (autoShoppingControls: ha false, nem kerül fel automatikusan a listára)
            const [items, setItems] = React.useState([
                { id: 1, name: 'Búzaliszt', category: 'Alapanyag', qty: 2, unit: 'kg', min: 1, autoShopping: true },
                { id: 2, name: 'Kristálycukor', category: 'Alapanyag', qty: 0, unit: 'kg', min: 1, autoShopping: true },
                { id: 3, name: 'Különleges Fűszer', category: 'Egyéb', qty: 0, unit: 'db', min: 1, autoShopping: false }
            ]);

            // Külön felírt bevásárlólista tételek
            const [customShoppingItems, setCustomShoppingItems] = React.useState([
                { id: 101, name: 'Sütőpapír', note: '30 méteres' }
            ]);

            const [logs, setLogs] = React.useState([
                { id: 1, date: new Date().toLocaleDateString(), text: 'Rendszer elindítva' }
            ]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCategory, setSelectedCategory] = React.useState('Összes');

            // Új spájz tétel state
            const [newName, setNewName] = React.useState('');
            const [newCategory, setNewCategory] = React.useState('Alapanyag');
            const [newQty, setNewQty] = React.useState(1);
            const [newUnit, setNewUnit] = React.useState('db');
            const [newMin, setNewMin] = React.useState(1);
            const [newAutoShopping, setNewAutoShopping] = React.useState(true);

            // Új önálló bevásárlólista tétel state
            const [customName, setCustomName] = React.useState('');
            const [customNote, setCustomNote] = React.useState('');
            const [showAddCustom, setShowAddCustom] = React.useState(false);

            const categories = ['Összes', 'Alapanyag', 'Folyadék', 'Hűtő', 'Fagyasztó', 'Egyéb'];

            // Spájz tétel hozzáadása
            const handleAddItem = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const newItem = {
                    id: Date.now(),
                    name: newName,
                    category: newCategory,
                    qty: Number(newQty),
                    unit: newUnit,
                    min: Number(newMin),
                    autoShopping: newAutoShopping
                };
                setItems([...items, newItem]);
                setLogs([{ id: Date.now(), date: new Date().toLocaleDateString(), text: `Hozzáadva a spájzhoz: ${newName}` }, ...logs]);
                setNewName('');
                setActiveTab('inventory');
            };

            // Önálló tétel hozzáadása a bevásárlólistához
            const handleAddCustomShopping = (e) => {
                e.preventDefault();
                if (!customName.trim()) return;
                setCustomShoppingItems([...customShoppingItems, { id: Date.now(), name: customName, note: customNote }]);
                setCustomName('');
                setCustomNote('');
                setShowAddCustom(false);
            };

            const removeCustomShopping = (id) => {
                setCustomShoppingItems(customShoppingItems.filter(item => item.id !== id));
            };

            const updateQty = (id, delta) => {
                setItems(items.map(item => {
                    if (item.id === id) {
                        return { ...item, qty: Math.max(0, item.qty + delta) };
                    }
                    return item;
                }));
            };

            // Automatikus lista tételek (csak amiknél autoShopping = true)
            const lowStockItems = items.filter(i => i.qty <= i.min && i.autoShopping);

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Fejléc */}
                        <header className="bg-emerald-700 text-white p-4 rounded-2xl shadow-lg mb-4 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold">🏠 Online Spájz</h1>
                                <p className="text-xs text-emerald-100">Konyhai raktárkészlet</p>
                            </div>
                            <span className="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-semibold">
                                {items.length} tétel
                            </span>
                        </header>

                        {/* Figyelmeztetés */}
                        {(lowStockItems.length > 0 || customShoppingItems.length > 0) && (
                            <div className="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-xl mb-4 shadow-sm text-xs text-amber-800">
                                <span className="font-bold">⚠️ Bevásárlólista:</span> {lowStockItems.length + customShoppingItems.length} tétel van a listán!
                            </div>
                        )}

                        {/* SPÁJZ NÉZET */}
                        {activeTab === 'inventory' && (
                            <div>
                                <div className="mb-3 flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Keresés a spájzban..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full p-2.5 border rounded-xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
                                    />
                                </div>

                                <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3">
                                    {categories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-gray-200 text-gray-700'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                <div className="space-y-2.5">
                                    {items
                                        .filter(i => selectedCategory === 'Összes' || i.category === selectedCategory)
                                        .filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()))
                                        .map(item => (
                                            <div key={item.id} className="bg-white p-3.5 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <h3 className="font-semibold text-sm">{item.name}</h3>
                                                        <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">{item.category}</span>
                                                        {!item.autoShopping && (
                                                            <span className="text-[10px] bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded-md" title="Nem kerül automatikusan a listára">🛡️ Külön téves</span>
                                                        )}
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-1">
                                                        Készlet: <span className={item.qty <= 0 ? "text-red-600 font-bold" : item.qty <= item.min ? "text-amber-600 font-bold" : "text-emerald-600 font-bold"}>
                                                            {item.qty} {item.unit}
                                                        </span> (Min: {item.min} {item.unit})
                                                    </p>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <button 
                                                        onClick={() => updateQty(item.id, -1)}
                                                        className="bg-gray-100 w-8 h-8 rounded-lg font-bold flex items-center justify-center hover:bg-gray-200 text-gray-700"
                                                    >-</button>
                                                    <button 
                                                        onClick={() => updateQty(item.id, 1)}
                                                        className="bg-emerald-100 text-emerald-800 w-8 h-8 rounded-lg font-bold flex items-center justify-center hover:bg-emerald-200"
                                                    >+</button>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {/* BEVÁSÁRLÓLISTA NÉZET */}
                        {activeTab === 'shopping' && (
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                    <div className="flex justify-between items-center mb-3">
                                        <h2 className="font-bold text-base text-emerald-800">🛒 Bevásárlólista</h2>
                                        <button 
                                            onClick={() => setShowAddCustom(!showAddCustom)}
                                            className="text-xs bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-medium"
                                        >
                                            {showAddCustom ? 'Mégse' : '+ Egyedi tétel felírása'}
                                        </button>
                                    </div>

                                    {/* Egyedi tétel felíró űrlap */}
                                    {showAddCustom && (
                                        <form onSubmit={handleAddCustomShopping} className="bg-emerald-50 p-3 rounded-xl mb-4 border border-emerald-200 space-y-2">
                                            <input 
                                                type="text" 
                                                placeholder="Mit kell venni? (pl. Sütőpapír)" 
                                                required
                                                value={customName}
                                                onChange={e => setCustomName(e.target.value)}
                                                className="w-full p-2 text-xs border rounded-lg"
                                            />
                                            <input 
                                                type="text" 
                                                placeholder="Megjegyzés (pl. 2 csomag, akciós...)" 
                                                value={customNote}
                                                onChange={e => setCustomNote(e.target.value)}
                                                className="w-full p-2 text-xs border rounded-lg"
                                            />
                                            <button type="submit" className="w-full bg-emerald-700 text-white text-xs py-1.5 rounded-lg font-semibold">
                                                Felírás a listára
                                            </button>
                                        </form>
                                    )}

                                    {/* Külön felírt egyedi tételek */}
                                    {customShoppingItems.length > 0 && (
                                        <div className="mb-4">
                                            <h3 className="text-xs font-bold text-gray-500 mb-2 uppercase">📝 Egyedileg felírt dolgok</h3>
                                            <div className="space-y-2">
                                                {customShoppingItems.map(item => (
                                                    <div key={item.id} className="flex justify-between items-center p-3 bg-purple-50 rounded-xl border border-purple-100">
                                                        <div>
                                                            <h4 className="font-semibold text-sm text-purple-900">{item.name}</h4>
                                                            {item.note && <p className="text-xs text-purple-600">{item.note}</p>}
                                                        </div>
                                                        <button 
                                                            onClick={() => removeCustomShopping(item.id)}
                                                            className="bg-purple-600 text-white text-xs px-2.5 py-1.5 rounded-lg font-medium"
                                                        >
                                                            ✓ Megvéve
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Automatikusan felkerült spájz tételek */}
                                    <div>
                                        <h3 className="text-xs font-bold text-gray-500 mb-2 uppercase">📦 Spájzból kifogyott tételek</h3>
                                        {lowStockItems.length === 0 ? (
                                            <p className="text-xs text-gray-400 py-2">Nincs kifogyott spájz tétel.</p>
                                        ) : (
                                            <div className="space-y-2">
                                                {lowStockItems.map(item => (
                                                    <div key={item.id} className="flex justify-between items-center p-3 bg-red-50 rounded-xl border border-red-100">
                                                        <div>
                                                            <h4 className="font-semibold text-sm text-red-900">{item.name}</h4>
                                                            <p className="text-xs text-red-600">Jelenleg: {item.qty} {item.unit} (Min: {item.min})</p>
                                                        </div>
                                                        <button 
                                                            onClick={() => updateQty(item.id, item.min + 1 - item.qty)}
                                                            className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium"
                                                        >
                                                            + Feltöltve
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ÚJ TÉTEL NÉZET */}
                        {activeTab === 'add' && (
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="font-bold text-base mb-3 text-emerald-800">➕ Új tétel rögzítése a Spájzba</h2>
                                <form onSubmit={handleAddItem} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Tétel neve</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="pl. Liszt, Cukor..." 
                                            value={newName}
                                            onChange={e => setNewName(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Kategória</label>
                                        <select 
                                            value={newCategory} 
                                            onChange={e => setNewCategory(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm bg-white"
                                        >
                                            {categories.filter(c => c !== 'Összes').map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-medium text-gray-600 mb-1">Mennyiség</label>
                                            <input 
                                                type="number" 
                                                min="0" 
                                                value={newQty} 
                                                onChange={e => setNewQty(e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-sm"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-600 mb-1">Mértékegység</label>
                                            <select 
                                                value={newUnit} 
                                                onChange={e => setNewUnit(e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-sm bg-white"
                                            >
                                                <option value="kg">kg</option>
                                                <option value="dkg">dkg</option>
                                                <option value="liter">liter</option>
                                                <option value="db">db</option>
                                                <option value="csomag">csomag</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Minimális készlet</label>
                                        <input 
                                            type="number" 
                                            min="0" 
                                            value={newMin} 
                                            onChange={e => setNewMin(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm"
                                        />
                                    </div>

                                    {/* ÚJ FUNKCIÓ: Kapcsoló, hogy a bevásárlólistára kerüljön-e */}
                                    <div className="flex items-center gap-2 p-3 bg-gray-50 rounded-xl border border-gray-200 mt-2">
                                        <input 
                                            type="checkbox" 
                                            id="autoShopping"
                                            checked={newAutoShopping}
                                            onChange={e => setNewAutoShopping(e.target.checked)}
                                            className="w-4 h-4 text-emerald-600 rounded focus:ring-emerald-500"
                                        />
                                        <label htmlFor="autoShopping" className="text-xs text-gray-700 cursor-pointer">
                                            Kerüljön a bevásárlólistára, ha kevés van belőle
                                        </label>
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-700 mt-2"
                                    >
                                        Mentés a spájzba
                                    </button>
                                </form>
                            </div>
                        )}

                        {/* NAPLÓ NÉZET */}
                        {activeTab === 'stats' && (
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="font-bold text-base mb-3 text-emerald-800">📊 Napló</h2>
                                <div className="space-y-2">
                                    {logs.map(log => (
                                        <div key={log.id} className="p-2.5 bg-gray-50 rounded-xl text-xs flex justify-between items-center">
                                            <span>{log.text}</span>
                                            <span className="text-gray-400 text-[10px]">{log.date}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Alsó navigáció */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2.5 px-4 flex justify-around items-center max-w-md mx-auto shadow-lg rounded-t-2xl">
                        <button 
                            onClick={() => setActiveTab('inventory')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'inventory' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>📦 Spájz</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('shopping')}
                            className={`flex flex-col items-center text-xs font-medium relative ${activeTab === 'shopping' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>🛒 Lista</span>
                            {(lowStockItems.length + customShoppingItems.length) > 0 && (
                                <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                    {lowStockItems.length + customShoppingItems.length}
                                </span>
                            )}
                        </button>
                        <button 
                            onClick={() => setActiveTab('add')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'add' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>➕ Új tétel</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('stats')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'stats' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>📊 Napló</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
