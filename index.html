<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Spájz</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React és Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#10b981" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="spajzicon.png" />
</head>
<body class="bg-gray-50 text-gray-900">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [items, setItems] = React.useState([
                { id: 1, name: 'Liszt', category: 'Alapanyag', qty: 2, unit: 'kg', min: 1 },
                { id: 2, name: 'Cukor', category: 'Alapanyag', qty: 0, unit: 'kg', min: 1 }
            ]);
            const [searchTerm, setSearchTerm] = React.useState('');

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen pb-20">
                    <header className="flex justify-between items-center mb-6 bg-emerald-700 text-white p-4 rounded-2xl shadow-lg">
                        <h1 className="text-xl font-bold flex items-center gap-2">Spájz Raktár</h1>
                        <span className="bg-emerald-800 text-xs px-2.5 py-1 rounded-full">{items.length} tétel</span>
                    </header>

                    <div className="mb-4">
                        <input 
                            type="text" 
                            placeholder="Keresés..." 
                            value={searchTerm}
                            onChange={(e) => setSearchTerm(e.target.value)}
                            className="w-full p-3 border rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                        />
                    </div>

                    <div className="space-y-3">
                        {items.filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase())).map(item => (
                            <div key={item.id} className="bg-white p-4 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
                                <div>
                                    <h3 className="font-semibold text-lg">{item.name}</h3>
                                    <p className="text-sm text-gray-500">Készlet: <span className={item.qty <= item.min ? "text-red-600 font-bold" : "text-emerald-600 font-bold"}>{item.qty} {item.unit}</span> (Min: {item.min})</p>
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setItems(items.map(i => i.id === item.id ? {...i, qty: Math.max(0, i.qty - 1)} : i))}
                                        className="bg-gray-100 px-3 py-1.5 rounded-lg font-bold hover:bg-gray-200"
                                    >-</button>
                                    <button 
                                        onClick={() => setItems(items.map(i => i.id === item.id ? {...i, qty: i.qty + 1} : i))}
                                        className="bg-emerald-100 text-emerald-800 px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-200"
                                    >+</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
