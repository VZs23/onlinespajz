<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Spájz & Raktár</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="spajzicon.png" />
</head>
<body class="bg-gray-50 text-gray-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [activeTab, setActiveTab] = React.useState('inventory');
            const [items, setItems] = React.useState([
                { id: 1, name: 'Búzaliszt', category: 'Alapanyag', qty: 2, unit: 'kg', min: 1 },
                { id: 2, name: 'Kristálycukor', category: 'Alapanyag', qty: 0, unit: 'kg', min: 1 },
                { id: 3, name: 'Étolaj', category: 'Folyadék', qty: 1, unit: 'liter', min: 2 }
            ]);
            const [logs, setLogs] = React.useState([
                { id: 1, date: '2026-03-30', text: 'Kezdeti feltöltés: Búzaliszt (2 kg)' }
            ]);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [selectedCategory, setSelectedCategory] = React.useState('Összes');

            // Új tétel űrlap state
            const [newName, setNewName] = React.useState('');
            const [newCategory, setNewCategory] = React.useState('Alapanyag');
            const [newQty, setNewQty] = React.useState(1);
            const [newUnit, setNewUnit] = React.useState('db');
            const [newMin, setNewMin] = React.useState(1);

            const categories = ['Összes', 'Alapanyag', 'Folyadék', 'Hűtő', 'Fagyasztó', 'Egyéb'];

            const handleAddItem = (e) => {
                e.preventDefault();
                if (!newName.trim()) return;
                const newItem = {
                    id: Date.now(),
                    name: newName,
                    category: newCategory,
                    qty: Number(newQty),
                    unit: newUnit,
                    min: Number(newMin)
                };
                setItems([...items, newItem]);
                setLogs([{ id: Date.now(), date: new Date().toLocaleDateString(), text: `Hozzáadva: ${newName} (${newQty} ${newUnit})` }, ...logs]);
                setNewName('');
                setActiveTab('inventory');
            };

            const updateQty = (id, delta) => {
                setItems(items.map(item => {
                    if (item.id === id) {
                        const newQ = Math.max(0, item.qty + delta);
                        return { ...item, qty: newQ };
                    }
                    return item;
                }));
            };

            const lowStockItems = items.filter(i => i.qty <= i.min);

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Fejléc */}
                        <header className="bg-emerald-700 text-white p-4 rounded-2xl shadow-lg mb-4 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold">🏠 Online Spájz</h1>
                                <p className="text-xs text-emerald-100">Családi raktárkészlet</p>
                            </div>
                            <span className="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-semibold">
                                {items.length} tétel
                            </span>
                        </header>

                        {/* Figyelmeztetés, ha kevés van valmiből */}
                        {lowStockItems.length > 0 && (
                            <div className="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-xl mb-4 shadow-sm text-xs text-amber-800">
                                <span className="font-bold">⚠️ Figyelem:</span> {lowStockItems.length} tétel fogyóban vagy elfogyott!
                            </div>
                        )}

                        {/* Tartalom nézetek */}
                        {activeTab === 'inventory' && (
                            <div>
                                <div className="mb-3 flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Keresés a spájzban..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full p-2.5 border rounded-xl text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white"
                                    />
                                </div>

                                {/* Kategória szűrők */}
                                <div className="flex gap-1.5 overflow-x-auto pb-2 mb-3 scrollbar-none">
                                    {categories.map(cat => (
                                        <button
                                            key={cat}
                                            onClick={() => setSelectedCategory(cat)}
                                            className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap transition-colors ${selectedCategory === cat ? 'bg-emerald-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                        >
                                            {cat}
                                        </button>
                                    ))}
                                </div>

                                {/* Lista */}
                                <div className="space-y-2.5">
                                    {items
                                        .filter(i => selectedCategory === 'Összes' || i.category === selectedCategory)
                                        .filter(i => i.name.toLowerCase().includes(searchTerm.toLowerCase()))
                                        .map(item => (
                                            <div key={item.id} className="bg-white p-3.5 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <h3 className="font-semibold text-sm">{item.name}</h3>
                                                        <span className="text-[10px] bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">{item.category}</span>
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-1">
                                                        Készlet: <span className={item.qty <= 0 ? "text-red-600 font-bold" : item.qty <= item.min ? "text-amber-600 font-bold" : "text-emerald-600 font-bold"}>
                                                            {item.qty} {item.unit}
                                                        </span> (Min: {item.min} {item.unit})
                                                    </p>
                                                </div>
                                                <div className="flex items-center gap-1.5">
                                                    <button 
                                                        onClick={() => updateQty(item.id, -1)}
                                                        className="bg-gray-100 w-8 h-8 rounded-lg font-bold flex items-center justify-center hover:bg-gray-200 text-gray-700"
                                                    >-</button>
                                                    <button 
                                                        onClick={() => updateQty(item.id, 1)}
                                                        className="bg-emerald-100 text-emerald-800 w-8 h-8 rounded-lg font-bold flex items-center justify-center hover:bg-emerald-200"
                                                    >+</button>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'shopping' && (
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="font-bold text-base mb-3 text-emerald-800">🛒 Bevásárlólista (Kevés / Elfogyott)</h2>
                                {lowStockItems.length === 0 ? (
                                    <p className="text-sm text-gray-500 text-center py-6">Mindenből elegendő készlet van otthon! 🎉</p>
                                ) : (
                                    <div className="space-y-2">
                                        {lowStockItems.map(item => (
                                            <div key={item.id} className="flex justify-between items-center p-3 bg-red-50 rounded-xl border border-red-100">
                                                <div>
                                                    <h4 className="font-semibold text-sm text-red-900">{item.name}</h4>
                                                    <p className="text-xs text-red-600">Jelenleg: {item.qty} {item.unit} (Minimum: {item.min})</p>
                                                </div>
                                                <button 
                                                    onClick={() => updateQty(item.id, item.min + 1 - item.qty)}
                                                    className="bg-emerald-600 text-white text-xs px-3 py-1.5 rounded-lg font-medium hover:bg-emerald-700"
                                                >
                                                    Megvéve (+Feltöltés)
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'add' && (
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="font-bold text-base mb-3 text-emerald-800">➕ Új tétel rögzítése</h2>
                                <form onSubmit={handleAddItem} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Tétel neve</label>
                                        <input 
                                            type="text" 
                                            required
                                            placeholder="pl. Tej, Só, Liszt..." 
                                            value={newName}
                                            onChange={e => setNewName(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Kategória</label>
                                        <select 
                                            value={newCategory} 
                                            onChange={e => setNewCategory(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white"
                                        >
                                            {categories.filter(c => c !== 'Összes').map(c => <option key={c} value={c}>{c}</option>)}
                                        </select>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-medium text-gray-600 mb-1">Kezdő mennyiség</label>
                                            <input 
                                                type="number" 
                                                min="0" 
                                                value={newQty} 
                                                onChange={e => setNewQty(e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-medium text-gray-600 mb-1">Mértékegység</label>
                                            <select 
                                                value={newUnit} 
                                                onChange={e => setNewUnit(e.target.value)}
                                                className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none bg-white"
                                            >
                                                <option value="kg">kg</option>
                                                <option value="dkg">dkg</option>
                                                <option value="liter">liter</option>
                                                <option value="db">db</option>
                                                <option value="csomag">csomag</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-medium text-gray-600 mb-1">Minimális készlet (riasztási szint)</label>
                                        <input 
                                            type="number" 
                                            min="0" 
                                            value={newMin} 
                                            onChange={e => setNewMin(e.target.value)}
                                            className="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none"
                                        />
                                    </div>
                                    <button 
                                        type="submit"
                                        className="w-full bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-semibold hover:bg-emerald-700 transition-colors mt-2"
                                    >
                                        Mentés a spájzba
                                    </button>
                                </form>
                            </div>
                        )}

                        {activeTab === 'stats' && (
                            <div className="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                                <h2 className="font-bold text-base mb-3 text-emerald-800">📊 Napló & Statisztika</h2>
                                <p className="text-xs text-gray-500 mb-3">Itt láthatók a legutóbbi készletváltozások:</p>
                                <div className="space-y-2">
                                    {logs.map(log => (
                                        <div key={log.id} className="p-2.5 bg-gray-50 rounded-xl text-xs border border-gray-100 flex justify-between items-center">
                                            <span>{log.text}</span>
                                            <span className="text-gray-400 text-[10px]">{log.date}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Alsó navigációs sáv */}
                    <nav className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 flex justify-around items-center max-w-md mx-auto shadow-lg rounded-t-2xl">
                        <button 
                            onClick={() => setActiveTab('inventory')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'inventory' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>📦 Spájz</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('shopping')}
                            className={`flex flex-col items-center text-xs font-medium relative ${activeTab === 'shopping' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>🛒 Lista</span>
                            {lowStockItems.length > 0 && (
                                <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                    {lowStockItems.length}
                                </span>
                            )}
                        </button>
                        <button 
                            onClick={() => setActiveTab('add')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'add' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>➕ Új tétel</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('stats')}
                            className={`flex flex-col items-center text-xs font-medium ${activeTab === 'stats' ? 'text-emerald-600' : 'text-gray-400'}`}
                        >
                            <span>📊 Napló</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
