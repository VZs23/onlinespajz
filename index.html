<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Spájz & Raktár</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="spajzicon.png" />
</head>
<body class="bg-gray-50 text-gray-900 pb-24">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDXqUKm9hYzixLWstoxcg3994N9qR94iPU",
            authDomain: "onlinespajz.firebaseapp.com",
            projectId: "onlinespajz",
            storageBucket: "onlinespajz.firebasestorage.app",
            messagingSenderId: "800782106101",
            appId: "1:800782106101:web:baac4a9b4758e5c517b4bc",
            measurementId: "G-Z792BF0BNS"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function App() {
            const [activeTab, setActiveTab] = React.useState('inventory');
            const [expandedItemId, setExpandedItemId] = React.useState(null);
            const [editingItemId, setEditingItemId] = React.useState(null);
            
            const [items, setItems] = React.useState([]);
            const [customShoppingItems, setCustomShoppingItems] = React.useState([]);
            const [logs, setLogs] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [storageFilter, setStorageFilter] = React.useState('Összes');
            const [selectedCategory, setSelectedCategory] = React.useState('Összes');
            const [sortBy, setSortBy] = React.useState('newest'); // 'abc', 'abc-rev', 'newest', 'oldest'

            const [showQuickAdd, setShowQuickAdd] = React.useState(false);

            // Új spájz tétel state
            const [newName, setNewName] = React.useState('');
            const [newCategory, setNewCategory] = React.useState('Alapanyag');
            const [customCategoryInput, setCustomCategoryInput] = React.useState('');
            
            const [newStorage, setNewStorage] = React.useState('Kamra');
            const [customStorageInput, setCustomStorageInput] = React.useState('');

            const [newQty, setNewQty] = React.useState(1);
            const [newUnit, setNewUnit] = React.useState('db');
            const [customUnitInput, setCustomUnitInput] = React.useState('');

            const [newMin, setNewMin] = React.useState(1);
            const [newExpiry, setNewExpiry] = React.useState('');
            const [newAutoShopping, setNewAutoShopping] = React.useState(true);

            // Szerkesztési state-ek
            const [editName, setEditName] = React.useState('');
            const [editCategory, setEditCategory] = React.useState('');
            const [editCustomCategoryInput, setEditCustomCategoryInput] = React.useState('');
            const [editStorage, setEditStorage] = React.useState('Kamra');
            const [editCustomStorageInput, setEditCustomStorageInput] = React.useState('');
            const [editExpiry, setEditExpiry] = React.useState('');
            const [editMin, setEditMin] = React.useState(1);
            const [editUnit, setEditUnit] = React.useState('');

            // Egyedi bevásárlólista state
            const [customName, setCustomName] = React.useState('');
            const [customNote, setCustomNote] = React.useState('');
            const [showAddCustom, setShowAddCustom] = React.useState(false);

            const [defaultCategories] = React.useState(['Alapanyag', 'Folyadék', 'Hűtő', 'Fagyasztó', 'Egyéb']);
            const defaultUnits = ['db', 'kg', 'dkg', 'liter', 'csomag'];
            const defaultStorageLocations = ['Kamra', 'Hűtő', 'Mélyhűtő', 'Pince'];

            const allStorageLocations = ['Összes', ...Array.from(new Set([...defaultStorageLocations, ...items.map(i => i.storage).filter(Boolean)]))];
            const allCategories = ['Összes', ...Array.from(new Set([...defaultCategories, ...items.map(i => i.category).filter(Boolean)]))];

            const getStorageIcon = (storageName) => {
                switch(storageName) {
                    case 'Kamra': return '🏠';
                    case 'Hűtő': return '❄️';
                    case 'Mélyhűtő': return '🧊';
                    case 'Pince': return '🍷';
                    case 'Összes': return '📦';
                    default: return '📍';
                }
            };

            const expiryGuide = [
                { name: 'Tej (friss)', cycle: '3 - 7 nap (Hűtőben)' },
                { name: 'Tej (tartós / UHT)', cycle: '3 - 6 hónap (Kamrában)' },
                { name: 'Tojás', cycle: '3 - 5 hét (Hűtőben)' },
                { name: 'Liszt, Cukor', cycle: '6 - 12+ hónap (Kamrában)' },
                { name: 'Sajt', cycle: '2 - 4 hét (Hűtőben)' },
                { name: 'Tejföl / Joghurt', cycle: '2 - 3 hét (Hűtőben)' },
                { name: 'Kenyér', cycle: '4 - 7 nap (vagy fagyasztva hónapokig)' },
                { name: 'Húsok (baromfi/sertés)', cycle: '1 - 5 nap (Hűtő) / 4-6 hónap (Mélyhűtő)' },
                { name: 'Zöldségek / Gyümölcsök', cycle: '3 nap - 3 hét (Fajtától függően)' },
                { name: 'Konzerv', cycle: '1 - 3 év (Kamrában)' }
            ];

            React.useEffect(() => {
                const unsubscribeItems = db.collection('spajz_items').onSnapshot(snapshot => {
                    const loadedItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(loadedItems);
                });

                const unsubscribeShopping = db.collection('spajz_custom_shopping').onSnapshot(snapshot => {
                    const loadedShopping = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCustomShoppingItems(loadedShopping);
                });

                const unsubscribeLogs = db.collection('spajz_logs').onSnapshot(snapshot => {
                    const loadedLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLogs(loadedLogs.sort((a, b) => b.timestamp - a.timestamp));
                });

                return () => {
                    unsubscribeItems();
                    unsubscribeShopping();
                    unsubscribeLogs();
                };
            }, []);

            const openQuickAdd = () => {
                const targetStorage = storageFilter === 'Összes' ? 'Kamra' : storageFilter;
                const targetCategory = selectedCategory === 'Összes' ? 'Alapanyag' : selectedCategory;

                setNewStorage(targetStorage);
                setNewCategory(targetCategory);
                setShowQuickAdd(!showQuickAdd);
            };

            const handleAddItem = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;

                const finalStorage = newStorage === 'Saját tárolóhely...' ? (customStorageInput.trim() || 'Kamra') : newStorage;
                const finalCategory = newCategory === 'Saját kategória...' ? (customCategoryInput.trim() || 'Egyéb') : newCategory;
                const finalUnit = newUnit === 'Saját mértékegység...' ? (customUnitInput.trim() || 'db') : newUnit;

                const today = new Date().toISOString().split('T')[0];
                const newItem = {
                    name: newName,
                    category: finalCategory,
                    storage: finalStorage,
                    qty: Number(newQty),
                    unit: finalUnit,
                    min: Number(newMin),
                    autoShopping: newAutoShopping,
                    addedDate: today,
                    expiryDate: newExpiry,
                    timestamp: Date.now()
                };

                await db.collection('spajz_items').add(newItem);
                await db.collection('spajz_logs').add({ 
                    text: `Hozzáadva [${finalStorage}]: ${newName} (${newItem.qty} ${newItem.unit})`, 
                    date: new Date().toLocaleDateString(), 
                    timestamp: Date.now() 
                });
                
                setNewName('');
                setNewExpiry('');
                setCustomStorageInput('');
                setCustomCategoryInput('');
                setCustomUnitInput('');
                setShowQuickAdd(false);
                setActiveTab('inventory');
            };

            const startEditing = (item) => {
                setEditingItemId(item.id);
                setEditName(item.name || '');
                
                if (defaultCategories.includes(item.category)) {
                    setEditCategory(item.category || 'Alapanyag');
                    setEditCustomCategoryInput('');
                } else {
                    setEditCategory('Saját kategória...');
                    setEditCustomCategoryInput(item.category || '');
                }
                
                if (defaultStorageLocations.includes(item.storage)) {
                    setEditStorage(item.storage || 'Kamra');
                    setEditCustomStorageInput('');
                } else {
                    setEditStorage('Saját tárolóhely...');
                    setEditCustomStorageInput(item.storage || '');
                }

                setEditExpiry(item.expiryDate || '');
                setEditMin(item.min || 1);
                setEditUnit(item.unit || 'db');
            };

            const saveEdit = async (id) => {
                if (!editName.trim()) return;
                const finalEditStorage = editStorage === 'Saját tárolóhely...' ? (editCustomStorageInput.trim() || 'Kamra') : editStorage;
                const finalEditCategory = editCategory === 'Saját kategória...' ? (editCustomCategoryInput.trim() || 'Egyéb') : editCategory;

                await db.collection('spajz_items').doc(id).update({
                    name: editName,
                    category: finalEditCategory,
                    storage: finalEditStorage,
                    expiryDate: editExpiry,
                    min: Number(editMin),
                    unit: editUnit
                });
                await db.collection('spajz_logs').add({ 
                    text: `Módosítva a spájzban: ${editName}`, 
                    date: new Date().toLocaleDateString(), 
                    timestamp: Date.now() 
                });
                setEditingItemId(null);
            };

            const handleAddCustomShopping = async (e) => {
                e.preventDefault();
                if (!customName.trim()) return;
                await db.collection('spajz_custom_shopping').add({ 
                    name: customName, 
                    note: customNote, 
                    timestamp: Date.now() 
                });
                setCustomName('');
                setCustomNote('');
                setShowAddCustom(false);
            };

            const updateQty = async (id, delta) => {
                const item = items.find(i => i.id === id);
                if (!item) return;
                const newQty = Math.max(0, item.qty + delta);
                
                if (delta < 0) {
                    await db.collection('spajz_logs').add({
                        text: `Fogyasztva / Levonva: ${item.name} (-${Math.abs(delta)} ${item.unit})`,
                        itemName: item.name,
                        consumedQty: Math.abs(delta),
                        unit: item.unit,
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now()
                    });
                } else if (delta > 0) {
                    await db.collection('spajz_logs').add({
                        text: `Készlet növelve: ${item.name} (+${delta} ${item.unit})`,
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now()
                    });
                }

                await db.collection('spajz_items').doc(id).update({ qty: newQty });
            };

            const deletePantryItem = async (id, name) => {
                if (confirm(`Biztosan törölni szeretnéd ezt a tételt: ${name}?`)) {
                    await db.collection('spajz_items').doc(id).delete();
                    await db.collection('spajz_logs').add({ 
                        text: `Törölve a spájzból: ${name}`, 
                        date: new Date().toLocaleDateString(), 
                        timestamp: Date.now() 
                    });
                }
            };

            const removeCustomShopping = async (id) => {
                await db.collection('spajz_custom_shopping').doc(id).delete();
            };

            const lowStockItems = items.filter(i => i.qty <= i.min && i.autoShopping);
            const todayStr = new Date().toISOString().split('T')[0];

            const maxQtyInPantry = Math.max(...items.map(i => i.qty || 0), 1);
            const categoryCounts = items.reduce((acc, curr) => {
                const cat = curr.category || 'Egyéb';
                acc[cat] = (acc[cat] || 0) + (curr.qty || 0);
                return acc;
            }, {});
            const totalItemCount = items.reduce((sum, curr) => sum + (curr.qty || 0), 0);

            const consumptionMap = {};
            logs.forEach(log => {
                if (log.consumedQty && log.itemName) {
                    consumptionMap[log.itemName] = (consumptionMap[log.itemName] || 0) + log.consumedQty;
                }
            });
            const topConsumedList = Object.entries(consumptionMap)
                .map(([name, count]) => ({ name, count }))
                .sort((a, b) => b.count - a.count)
                .slice(0, 10);
            const maxConsumed = Math.max(...topConsumedList.map(i => i.count), 1);

            // Szűrés és Rendezés
            const filteredItems = items
                .filter(i => storageFilter === 'Összes' || i.storage === storageFilter)
                .filter(i => selectedCategory === 'Összes' || i.category === selectedCategory)
                .filter(i => i.name && i.name.toLowerCase().includes(searchTerm.toLowerCase()))
                .sort((a, b) => {
                    if (sortBy === 'abc') {
                        return (a.name || '').localeCompare(b.name || '');
                    } else if (sortBy === 'abc-rev') {
                        return (b.name || '').localeCompare(a.name || '');
                    } else if (sortBy === 'newest') {
                        return (b.timestamp || 0) - (a.timestamp || 0);
                    } else if (sortBy === 'oldest') {
                        return (a.timestamp || 0) - (b.timestamp || 0);
                    }
                    return 0;
                });

            return (
                <div className="max-w-md mx-auto p-4 min-h-screen flex flex-col justify-between">
                    <div>
                        {/* Fejléc */}
                        <header className="bg-emerald-700 text-white p-4 rounded-2xl shadow-lg mb-4 flex justify-between items-center">
                            <div>
                                <h1 className="text-xl font-bold">🏠 Online Spájz</h1>
                                <p className="text-xs text-emerald-100">☁️ Felhőben szinkronizálva</p>
                            </div>
                            <span className="bg-emerald-800 text-xs px-3 py-1.5 rounded-full font-semibold">
                                {items.length} tétel
                            </span>
                        </header>

                        {/* Figyelmeztető sáv */}
                        {(lowStockItems.length > 0 || customShoppingItems.length > 0) && (
                            <div className="bg-amber-50 border-l-4 border-amber-500 p-3 rounded-xl mb-4 shadow-sm text-xs text-amber-800 flex justify-between items-center">
                                <span><span className="font-bold">⚠️ Bevásárlólista:</span> {lowStockItems.length + customShoppingItems.length} tétel vár megvételre!</span>
                                <button onClick={() => setActiveTab('shopping')} className="font-bold underline text-amber-900">Megnézem</button>
                            </div>
                        )}

                        {/* SPÁJZ NÉZET */}
                        {activeTab === 'inventory' && (
                            <div>
                                <div className="mb-2.5 flex gap-2">
                                    <input 
                                        type="text" 
                                        placeholder="Keresés a spájzban..." 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                        className="w-full p-2.5 border rounded-xl text-sm shadow-sm bg-white"
                                    />
                                </div>

                                {/* Két soros szűrőrendszer + Rendezés */}
                                <div className="space-y-1.5 mb-3">
                                    {/* 1. Sor: Tárolóhelyek */}
                                    <div className="flex gap-1.5 overflow-x-auto pb-1">
                                        {allStorageLocations.map(loc => (
                                            <button
                                                key={loc}
                                                onClick={() => setStorageFilter(loc)}
                                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap ${storageFilter === loc ? 'bg-emerald-700 text-white shadow-sm' : 'bg-gray-200 text-gray-700'}`}
                                            >
                                                {getStorageIcon(loc)} {loc}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 2. Sor: Kategóriák */}
                                    <div className="flex gap-1.5 overflow-x-auto pb-1">
                                        {allCategories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`px-3 py-1 rounded-full text-xs font-medium whitespace-nowrap ${selectedCategory === cat ? 'bg-emerald-600 text-white shadow-sm' : 'bg-gray-100 text-gray-600'}`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>

                                    {/* 3. Sor: Rendezési sáv */}
                                    <div className="flex justify-between items-center bg-white p-2 rounded-xl border border-gray-200 text-xs">
                                        <span className="text-gray-500 font-medium">Rendezés:</span>
                                        <select value={sortBy} onChange={(e) => setSortBy(e.target.value)} className="bg-gray-50 p-1 rounded-lg border text-xs font-semibold text-emerald-800">
                                            <option value="newest">📅 Legújabb elöl</option>
                                            <option value="oldest">⏳ Legrégebbi elöl</option>
                                            <option value="abc">🔤 ABC (A-Z)</option>
                                            <option value="abc-rev">🔠 ABC fordítva (Z-A)</option>
                                        </select>
                                    </div>
                                </div>

                                {/* KÖZVETLEN ÚJ TÉTEL FELVITELE */}
                                <div className="mb-4">
                                    <button 
                                        onClick={openQuickAdd} 
                                        className="w-full bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs py-2.5 rounded-xl font-bold flex items-center justify-center gap-1.5 shadow-sm hover:bg-emerald-100 transition-all"
                                    >
                                        <span>{showQuickAdd ? '✖️ Mégse' : `➕ Új tétel felvétele ide (${getStorageIcon(storageFilter === 'Összes' ? 'Kamra' : storageFilter)} ${storageFilter === 'Összes' ? 'Kamra' : storageFilter} / ${selectedCategory === 'Összes' ? 'Alapanyag' : selectedCategory})`}</span>
                                    </button>

                                    {showQuickAdd && (
                                        <form onSubmit={handleAddItem} className="mt-2 bg-white p-3.5 rounded-2xl shadow-md border border-emerald-200 space-y-3">
                                            <h4 className="text-xs font-bold text-emerald-800 border-b pb-1">
                                                ➕ Rögzítés a(z) <span className="underline">{newStorage}</span> / <span className="underline">{newCategory}</span> kategóriába
                                            </h4>
                                            <div>
                                                <input type="text" required placeholder="Tétel neve (pl. Tej, Liszt...)" value={newName} onChange={e => setNewName(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-gray-50" />
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="text-[10px] text-gray-500 block">Tárolóhely</label>
                                                    <select value={newStorage} onChange={e => setNewStorage(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-white mb-1">
                                                        {defaultStorageLocations.map(s => <option key={s} value={s}>{getStorageIcon(s)} {s}</option>)}
                                                        {allStorageLocations.filter(l => l !== 'Összes' && !defaultStorageLocations.includes(l)).map(customLoc => (
                                                            <option key={customLoc} value={customLoc}>📍 {customLoc}</option>
                                                        ))}
                                                        <option value="Saját tárolóhely...">+ Saját...</option>
                                                    </select>
                                                    {newStorage === 'Saját tárolóhely...' && (
                                                        <input type="text" placeholder="Írd be a tárolót..." required value={customStorageInput} onChange={e => setCustomStorageInput(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-emerald-50 mt-1" />
                                                    )}
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-gray-500 block">Kategória</label>
                                                    <select value={newCategory} onChange={e => setNewCategory(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-white mb-1">
                                                        {defaultCategories.map(c => <option key={c} value={c}>{c}</option>)}
                                                        {allCategories.filter(c => c !== 'Összes' && !defaultCategories.includes(c)).map(customCat => (
                                                            <option key={customCat} value={customCat}>🏷️ {customCat}</option>
                                                        ))}
                                                        <option value="Saját kategória...">+ Saját...</option>
                                                    </select>
                                                    {newCategory === 'Saját kategória...' && (
                                                        <input type="text" placeholder="Írd be a kategóriát..." required value={customCategoryInput} onChange={e => setCustomCategoryInput(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-emerald-50 mt-1" />
                                                    )}
                                                </div>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2">
                                                <div>
                                                    <label className="text-[10px] text-gray-500 block">Mennyiség & egység</label>
                                                    <div className="flex gap-1">
                                                        <input type="number" min="0" value={newQty} onChange={e => setNewQty(e.target.value)} className="w-1/2 p-2 border rounded-xl text-xs" />
                                                        <select value={newUnit} onChange={e => setNewUnit(e.target.value)} className="w-1/2 p-2 border rounded-xl text-xs bg-white">
                                                            {defaultUnits.map(u => <option key={u} value={u}>{u}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                                <div>
                                                    <label className="text-[10px] text-gray-500 block">Lejárati dátum (Kézi)</label>
                                                    <input type="date" value={newExpiry} onChange={e => setNewExpiry(e.target.value)} className="w-full p-2 border rounded-xl text-xs bg-white" />
                                                </div>
                                            </div>
                                            <button type="submit" className="w-full bg-emerald-600 text-white text-xs py-2 rounded-xl font-bold hover:bg-emerald-700">Mentés közvetlenül ide</button>
                                        </form>
                                    )}
                                </div>

                                <div className="space-y-2.5">
                                    {filteredItems.length === 0 ? (
                                        <div className="text-center py-8 bg-white rounded-2xl border border-gray-100">
                                            <p className="text-sm text-gray-500">Nincs találat a szűrésnek megfelelő tételre!</p>
                                            <p className="text-xs text-gray-400 mt-1">Vegyél fel új tételeket fent vagy a ➕ menüpontban.</p>
                                        </div>
                                    ) : (
                                        filteredItems.map(item => {
                                            const isExpanded = expandedItemId === item.id;
                                            const isEditing = editingItemId === item.id;
                                            const isExpired = item.expiryDate && item.expiryDate.trim() !== '' && item.expiryDate < todayStr;
                                            const isOutOfStock = item.qty <= 0;
                                            
                                            let cardBgClass = "bg-white border-gray-100";
                                            if (isExpired) {
                                                cardBgClass = "bg-red-50 border-red-200";
                                            } else if (isOutOfStock) {
                                                cardBgClass = "bg-amber-50 border-amber-200";
                                            }

                                            return (
                                                <div key={item.id} className={`p-3.5 rounded-xl shadow-sm border ${cardBgClass}`}>
                                                    
                                                    {/* SZERKESZTŐ NÉZET */}
                                                    {isEditing ? (
                                                        <div className="space-y-3 bg-white/90 p-2.5 rounded-lg border border-amber-200">
                                                            <h4 className="text-xs font-bold text-amber-900">✏️ Tétel szerkesztése</h4>
                                                            <div>
                                                                <label className="text-[10px] text-gray-500 block">Név</label>
                                                                <input type="text" value={editName} onChange={e => setEditName(e.target.value)} className="w-full p-2 border rounded-lg text-xs" />
                                                            </div>
                                                            <div className="grid grid-cols-2 gap-2">
                                                                <div>
                                                                    <label className="text-[10px] text-gray-500 block">Tárolóhely</label>
                                                                    <select value={editStorage} onChange={e => setEditStorage(e.target.value)} className="w-full p-2 border rounded-lg text-xs bg-white mb-1">
                                                                        {defaultStorageLocations.map(s => <option key={s} value={s}>{getStorageIcon(s)} {s}</option>)}
                                                                        {allStorageLocations.filter(l => l !== 'Összes' && !defaultStorageLocations.includes(l)).map(customLoc => (

            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
