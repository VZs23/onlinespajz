<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Spájz & Raktár</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="spajzicon.png" />
</head>
<body class="pb-24 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyDXqUKm9hYzixLWstoxcg3994N9qR94iPU",
            authDomain: "onlinespajz.firebaseapp.com",
            projectId: "onlinespajz",
            storageBucket: "onlinespajz.firebasestorage.app",
            messagingSenderId: "800782106101",
            appId: "1:800782106101:web:baac4a9b4758e5c517b4bc",
            measurementId: "G-Z792BF0BNS"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function App() {
            const [activeTab, setActiveTab] = React.useState('inventory');
            const [expandedItemId, setExpandedItemId] = React.useState(null);
            const [editingItemId, setEditingItemId] = React.useState(null);
            
            const [darkMode, setDarkMode] = React.useState(() => {
                return localStorage.getItem('spajz_dark_mode') === 'true';
            });

            React.useEffect(() => {
                if (darkMode) {
                    document.body.className = "bg-gray-950 text-gray-100 pb-24 transition-colors duration-300";
                } else {
                    document.body.className = "bg-gray-50 text-gray-900 pb-24 transition-colors duration-300";
                }
            }, [darkMode]);

            const [items, setItems] = React.useState([]);
            const [customShoppingItems, setCustomShoppingItems] = React.useState([]);
            const [shoppingLists, setShoppingLists] = React.useState([]);
            const [activeListId, setActiveListId] = React.useState('default');
            const [logs, setLogs] = React.useState([]);

            const [undoStack, setUndoStack] = React.useState([]);
            const [redoStack, setRedoStack] = React.useState([]);

            const [searchTerm, setSearchTerm] = React.useState('');
            const [storageFilter, setStorageFilter] = React.useState('Összes');
            const [selectedCategory, setSelectedCategory] = React.useState('Összes');
            const [sortBy, setSortBy] = React.useState('newest');

            const [showQuickAdd, setShowQuickAdd] = React.useState(false);
            const [showNewListModal, setShowNewListModal] = React.useState(false);

            const [newListName, setNewListName] = React.useState('');
            const [newListType, setNewListType] = React.useState('pantry');

            const [newName, setNewName] = React.useState('');
            const [newCategory, setNewCategory] = React.useState('Alapanyag');
            const [customCategoryInput, setCustomCategoryInput] = React.useState('');
            
            const [newStorage, setNewStorage] = React.useState('Kamra');
            const [customStorageInput, setCustomStorageInput] = React.useState('');

            const [newQty, setNewQty] = React.useState(1);
            const [newUnit, setNewUnit] = React.useState('db');
            const [customUnitInput, setCustomUnitInput] = React.useState('');

            const [newMin, setNewMin] = React.useState(0);
            const [newExpiry, setNewExpiry] = React.useState('');
            const [expiryDays, setExpiryDays] = React.useState('');
            const [newAutoShopping, setNewAutoShopping] = React.useState(true);

            const [editName, setEditName] = React.useState('');
            const [editCategory, setEditCategory] = React.useState('');
            const [editCustomCategoryInput, setEditCustomCategoryInput] = React.useState('');
            const [editStorage, setEditStorage] = React.useState('Kamra');
            const [editCustomStorageInput, setEditCustomStorageInput] = React.useState('');
            const [editExpiry, setEditExpiry] = React.useState('');
            const [editExpiryDays, setEditExpiryDays] = React.useState('');
            const [editMin, setEditMin] = React.useState(0);
            const [editUnit, setEditUnit] = React.useState('');

            const [customName, setCustomName] = React.useState('');
            const [customQty, setCustomQty] = React.useState(1);
            const [customUnit, setCustomUnit] = React.useState('db');
            const [customTargetStorage, setCustomTargetStorage] = React.useState('Kamra');
            const [customTargetCategory, setCustomTargetCategory] = React.useState('Alapanyag');
            const [showAddCustom, setShowAddCustom] = React.useState(false);

            const [defaultCategories] = React.useState(['Alapanyag', 'Folyadék', 'Hűtő', 'Fagyasztó', 'Egyéb']);
            const defaultUnits = ['db', 'kg', 'dkg', 'liter', 'csomag'];
            const defaultStorageLocations = ['Kamra', 'Hűtő', 'Mélyhűtő', 'Pince'];

            const allStorageLocations = ['Összes', ...Array.from(new Set([...defaultStorageLocations, ...items.map(i => i.storage).filter(Boolean)]))];
            const allCategories = ['Összes', ...Array.from(new Set([...defaultCategories, ...items.map(i => i.category).filter(Boolean)]))];

            const allKnownItemNames = Array.from(new Set([
                ...items.map(i => i.name),
                ...customShoppingItems.map(i => i.name),
                'Tej', 'Tojás', 'Liszt', 'Cukor', 'Só', 'Olaj', 'Kenyér', 'Vaj', 'Sajt', 'Tészta'
            ])).filter(Boolean).sort();

            const toggleDarkMode = () => {
                const nextMode = !darkMode;
                setDarkMode(nextMode);
                localStorage.setItem('spajz_dark_mode', nextMode);
            };

            const getStorageIcon = (storageName) => {
                switch(storageName) {
                    case 'Kamra': return '🏠';
                    case 'Hűtő': return '❄️';
                    case 'Mélyhűtő': return '🧊';
                    case 'Pince': return '🍷';
                    case 'Összes': return '📦';
                    default: return '📍';
                }
            };

            const expiryGuide = [
                { name: 'Tej (friss)', cycle: '3 - 7 nap (Hűtőben)' },
                { name: 'Tej (tartós / UHT)', cycle: '3 - 6 hónap (Kamrában)' },
                { name: 'Tojás', cycle: '3 - 5 hét (Hűtőben)' },
                { name: 'Liszt, Cukor', cycle: '6 - 12+ hónap (Kamrában)' },
                { name: 'Sajt', cycle: '2 - 4 hét (Hűtőben)' },
                { name: 'Tejföl / Joghurt', cycle: '2 - 3 hét (Hűtőben)' },
                { name: 'Kenyér', cycle: '4 - 7 nap (vagy fagyasztva hónapokig)' },
                { name: 'Húsok (baromfi/sertés)', cycle: '1 - 5 nap (Hűtő) / 4-6 hónap (Mélyhűtő)' },
                { name: 'Zöldségek / Gyümölcsök', cycle: '3 nap - 3 hét (Fajtától függően)' },
                { name: 'Konzerv', cycle: '1 - 3 év (Kamrában)' }
            ];

            React.useEffect(() => {
                const unsubscribeItems = db.collection('spajz_items').onSnapshot(snapshot => {
                    const loadedItems = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setItems(loadedItems);
                });

                const unsubscribeShopping = db.collection('spajz_custom_shopping').onSnapshot(snapshot => {
                    const loadedShopping = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setCustomShoppingItems(loadedShopping);
                });

                const unsubscribeLists = db.collection('spajz_lists').onSnapshot(snapshot => {
                    const loadedLists = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    if (loadedLists.length === 0) {
                        db.collection('spajz_lists').doc('default').set({ name: '🛒 Fő Bevásárlólista (Spájzba)', type: 'pantry' });
                        db.collection('spajz_lists').doc('simple').set({ name: '📝 Sima lista (Nem spájz)', type: 'simple' });
                    }
                    setShoppingLists(loadedLists);
                });

                const unsubscribeLogs = db.collection('spajz_logs').onSnapshot(snapshot => {
                    const loadedLogs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setLogs(loadedLogs.sort((a, b) => b.timestamp - a.timestamp));
                });

                return () => {
                    unsubscribeItems();
                    unsubscribeShopping();
                    unsubscribeLists();
                    unsubscribeLogs();
                };
            }, []);

            const recordActionForUndo = () => {
                setUndoStack(prev => [...prev, JSON.parse(JSON.stringify(items))]);
                setRedoStack([]); 
            };

            const undo = async () => {
                if (undoStack.length === 0) return;
                const previousState = undoStack[undoStack.length - 1];
                const newUndoStack = undoStack.slice(0, undoStack.length - 1);

                setRedoStack(prev => [JSON.parse(JSON.stringify(items)), ...prev]);
                setUndoStack(newUndoStack);

                const batch = db.batch();
                const currentIds = items.map(i => i.id);
                const prevIds = previousState.map(i => i.id);

                for (const item of previousState) {
                    const { id, ...data } = item;
                    const docRef = db.collection('spajz_items').doc(id);
                    batch.set(docRef, data);
                }
                for (const id of currentIds) {
                    if (!prevIds.includes(id)) {
                        const docRef = db.collection('spajz_items').doc(id);
                        batch.delete(docRef);
                    }
                }
                await batch.commit();

                // Automatikus lista tisztítás Undo esetén, ha a készlet elegendő lett
                for (const prevItem of previousState) {
                    const pQty = Number(prevItem.qty) || 0;
                    const pMin = prevItem.min !== undefined ? Number(prevItem.min) : 0;
                    const hasEnough = pMin > 0 ? (pQty >= pMin) : (pQty >= 1);
                    if (hasEnough) {
                        const shopMatch = customShoppingItems.find(
                            si => si.name && si.name.toLowerCase().trim() === prevItem.name.toLowerCase().trim()
                        );
                        if (shopMatch) {
                            await db.collection('spajz_custom_shopping').doc(shopMatch.id).delete();
                        }
                    }
                }
            };

            const redo = async () => {
                if (redoStack.length === 0) return;
                const nextState = redoStack[0];
                const newRedoStack = redoStack.slice(1);

                setUndoStack(prev => [...prev, JSON.parse(JSON.stringify(items))]);
                setRedoStack(newRedoStack);

                const batch = db.batch();
                const currentIds = items.map(i => i.id);
                const nextIds = nextState.map(i => i.id);

                for (const item of nextState) {
                    const { id, ...data } = item;
                    const docRef = db.collection('spajz_items').doc(id);
                    batch.set(docRef, data);
                }
                for (const id of currentIds) {
                    if (!nextIds.includes(id)) {
                        const docRef = db.collection('spajz_items').doc(id);
                        batch.delete(docRef);
                    }
                }
                await batch.commit();

                for (const nextItem of nextState) {
                    const nQty = Number(nextItem.qty) || 0;
                    const nMin = nextItem.min !== undefined ? Number(nextItem.min) : 0;
                    const hasEnough = nMin > 0 ? (nQty >= nMin) : (nQty >= 1);
                    if (hasEnough) {
                        const shopMatch = customShoppingItems.find(
                            si => si.name && si.name.toLowerCase().trim() === nextItem.name.toLowerCase().trim()
                        );
                        if (shopMatch) {
                            await db.collection('spajz_custom_shopping').doc(shopMatch.id).delete();
                        }
                    }
                }
            };

            const resetLogs = async () => {
                if (confirm("Biztosan törölni szeretnéd a naplót és a Top 10 fogyasztási statisztikát?")) {
                    const snapshot = await db.collection('spajz_logs').get();
                    const batch = db.batch();
                    snapshot.docs.forEach(doc => {
                        batch.delete(doc.ref);
                    });
                    await batch.commit();
                }
            };

            const calculateExpiryFromDays = (days) => {
                if (!days || isNaN(days)) return '';
                const date = new Date();
                date.setDate(date.getDate() + Number(days));
                return date.toISOString().split('T')[0];
            };

            const openQuickAdd = () => {
                const targetStorage = storageFilter === 'Összes' ? 'Kamra' : storageFilter;
                const targetCategory = selectedCategory === 'Összes' ? 'Alapanyag' : selectedCategory;

                setNewStorage(targetStorage);
                setNewCategory(targetCategory);
                setShowQuickAdd(!showQuickAdd);
            };

            const handleCreateList = async (e) => {
                e.preventDefault();
                if (!newListName.trim()) return;
                await db.collection('spajz_lists').add({
                    name: newListName,
                    type: newListType,
                    timestamp: Date.now()
                });
                setNewListName('');
                setShowNewListModal(false);
            };

            const deleteList = async (listId, listName) => {
                if (confirm(`Biztosan törölni szeretnéd a(z) "${listName}" listát és a hozzá tartozó tételeket?`)) {
                    await db.collection('spajz_lists').doc(listId).delete();
                    const itemsToDelete = customShoppingItems.filter(i => (i.listId || 'default') === listId);
                    itemsToDelete.forEach(async (item) => {
                        await db.collection('spajz_custom_shopping').doc(item.id).delete();
                    });
                    setActiveListId('default');
                }
            };

            const handleAddItem = async (e) => {
                e.preventDefault();
                if (!newName.trim()) return;

                recordActionForUndo();

                const finalStorage = newStorage === 'Saját tárolóhely...' ? (customStorageInput.trim() || 'Kamra') : newStorage;
                const finalCategory = newCategory === 'Saját kategória...' ? (customCategoryInput.trim() || 'Egyéb') : newCategory;
                const finalUnit = newUnit === 'Saját mértékegység...' ? (customUnitInput.trim() || 'db') : newUnit;

                const finalExpiryDate = expiryDays ? calculateExpiryFromDays(expiryDays) : newExpiry;

                const today = new Date().toISOString().split('T')[0];
                const newItem = {
                    name: newName.trim(),
                    category: finalCategory,
                    storage: finalStorage,
                    qty: Number(newQty),
                    unit: finalUnit,
                    min: Number(newMin),
                    autoShopping: newAutoShopping,
                    addedDate: today,
                    expiryDate: finalExpiryDate,
                    timestamp: Date.now()
                };

                const cleanName = newItem.name.toLowerCase().trim();
                const existingShopMatch = customShoppingItems.find(
                    si => si.name && si.name.toLowerCase().trim() === cleanName
                );

                const hasEnough = newItem.min > 0 ? (newItem.qty >= newItem.min) : (newItem.qty >= 1);

                if (!hasEnough && newItem.autoShopping !== false) {
                    if (!existingShopMatch) {
                        await db.collection('spajz_custom_shopping').add({
                            name: newItem.name,
                            qty: Math.max(1, newItem.min > 0 ? (newItem.min - newItem.qty) : 1),
                            unit: newItem.unit,
                            storage: newItem.storage,
                            category: newItem.category,
                            listId: 'default',
                            timestamp: Date.now()
                        });
                    }
                } else if (hasEnough) {
                    if (existingShopMatch) {
                        await db.collection('spajz_custom_shopping').doc(existingShopMatch.id).delete();
                    }
                }

                await db.collection('spajz_items').add(newItem);
                await db.collection('spajz_logs').add({ 
                    text: `Hozzáadva [${finalStorage}]: ${newName} (${newItem.qty} ${newItem.unit})`, 
                    date: new Date().toLocaleDateString(), 
                    timestamp: Date.now() 
                });
                
                setNewName('');
                setNewQty(1);
                setNewMin(0);
                setNewExpiry('');
                setExpiryDays('');
                setCustomStorageInput('');
                setCustomCategoryInput('');
                setCustomUnitInput('');
                setShowQuickAdd(false);
                setActiveTab('inventory');
            };

            const startEditing = (item) => {
                setEditingItemId(item.id);
                setEditName(item.name || '');
                
                if (defaultCategories.includes(item.category)) {
                    setEditCategory(item.category || 'Alapanyag');
                    setEditCustomCategoryInput('');
                } else {
                    setEditCategory('Saját kategória...');
                    setEditCustomCategoryInput(item.category || '');
                }
                
                if (defaultStorageLocations.includes(item.storage)) {
                    setEditStorage(item.storage || 'Kamra');
                    setEditCustomStorageInput('');
                } else {
                    setEditStorage('Saját tárolóhely...');
                    setEditCustomStorageInput(item.storage || '');
                }

                setEditExpiry(item.expiryDate || '');
                setEditExpiryDays('');
                setEditMin(item.min !== undefined ? item.min : 0);
                setEditUnit(item.unit || 'db');
            };

            const saveEdit = async (id) => {
                if (!editName.trim()) return;

                recordActionForUndo();

                const finalEditStorage = editStorage === 'Saját tárolóhely...' ? (editCustomStorageInput.trim() || 'Kamra') : editStorage;
                const finalEditCategory = editCategory === 'Saját kategória...' ? (editCustomCategoryInput.trim() || 'Egyéb') : editCategory;
                const finalEditExpiry = editExpiryDays ? calculateExpiryFromDays(editExpiryDays) : editExpiry;

                const targetItem = items.find(i => i.id === id);
                const currentQty = targetItem ? Number(targetItem.qty) || 0 : 0;
                const newMinNum = Number(editMin);

                const hasEnough = newMinNum > 0 ? (currentQty >= newMinNum) : (currentQty >= 1);
                const cleanName = editName.toLowerCase().trim();
                const existingShopMatch = customShoppingItems.find(
                    si => si.name && si.name.toLowerCase().trim() === cleanName
                );

                if (hasEnough) {
                    if (existingShopMatch) {
                        await db.collection('spajz_custom_shopping').doc(existingShopMatch.id).delete();
                    }
                } else {
                    if (!existingShopMatch) {
                        await db.collection('spajz_custom_shopping').add({
                            name: editName.trim(),
                            qty: Math.max(1, newMinNum > 0 ? (newMinNum - currentQty) : 1),
                            unit: targetItem ? targetItem.unit || 'db' : 'db',
                            storage: finalEditStorage,
                            category: finalEditCategory,
                            listId: 'default',
                            timestamp: Date.now()
                        });
                    }
                }

                await db.collection('spajz_items').doc(id).update({
                    name: editName.trim(),
                    category: finalEditCategory,
                    storage: finalEditStorage,
                    expiryDate: finalEditExpiry,
                    min: newMinNum,
                    unit: editUnit
                });
                await db.collection('spajz_logs').add({ 
                    text: `Módosítva a spájzban: ${editName}`, 
                    date: new Date().toLocaleDateString(), 
                    timestamp: Date.now() 
                });
                setEditingItemId(null);
            };

            const handleAddCustomShopping = async (e) => {
                e.preventDefault();
                if (!customName.trim()) return;
                
                await db.collection('spajz_custom_shopping').add({ 
                    name: customName.trim(), 
                    qty: Number(customQty) || 1,
                    unit: customUnit || 'db',
                    storage: customTargetStorage || 'Kamra',
                    category: customTargetCategory || 'Alapanyag',
                    listId: activeListId,
                    timestamp: Date.now() 
                });
                setCustomName('');
                setCustomQty(1);
                setShowAddCustom(false);
            };

            const markAsPurchased = async (shoppingItem, isPantryList) => {
                recordActionForUndo();

                if (isPantryList) {
                    const cleanShopName = shoppingItem.name.toLowerCase().trim();
                    const existingItem = items.find(i => i.name && i.name.toLowerCase().trim() === cleanShopName);
                    const addQty = shoppingItem.qty || 1;

                    if (existingItem) {
                        await db.collection('spajz_items').doc(existingItem.id).update({
                            qty: (Number(existingItem.qty) || 0) + addQty
                        });
                        await db.collection('spajz_logs').add({
                            text: `Vásárolva & Feltöltve a spájzba: ${shoppingItem.name} (+${addQty} ${existingItem.unit || 'db'})`,
                            date: new Date().toLocaleDateString(),
                            timestamp: Date.now()
                        });
                    } else {
                        const today = new Date().toISOString().split('T')[0];
                        await db.collection('spajz_items').add({
                            name: shoppingItem.name,
                            category: shoppingItem.category || 'Alapanyag',
                            storage: shoppingItem.storage || 'Kamra',
                            qty: addQty,
                            unit: shoppingItem.unit || 'db',
                            min: 0,
                            autoShopping: true,
                            addedDate: today,
                            expiryDate: '',
                            timestamp: Date.now()
                        });
                        await db.collection('spajz_logs').add({
                            text: `Új élelmiszerként megvéve & spájzba vezetve: ${shoppingItem.name} (${addQty} ${shoppingItem.unit || 'db'})`,
                            date: new Date().toLocaleDateString(),
                            timestamp: Date.now()
                        });
                    }
                }

                await db.collection('spajz_custom_shopping').doc(shoppingItem.id).delete();
            };

            const updateQty = async (id, delta) => {
                const item = items.find(i => i.id === id);
                if (!item) return;

                recordActionForUndo();

                const currentQty = Number(item.qty) || 0;
                const newQty = Math.max(0, currentQty + delta);
                const itemMin = item.min !== undefined ? Number(item.min) : 0;
                
                if (delta < 0) {
                    await db.collection('spajz_logs').add({
                        text: `Fogyasztva / Levonva: ${item.name} (-${Math.abs(delta)} ${item.unit})`,
                        itemName: item.name,
                        consumedQty: Math.abs(delta),
                        unit: item.unit,
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now()
                    });
                } else if (delta > 0) {
                    await db.collection('spajz_logs').add({
                        text: `Készlet növelve: ${item.name} (+${delta} ${item.unit})`,
                        date: new Date().toLocaleDateString(),
                        timestamp: Date.now()
                    });
                }

                const cleanItemName = item.name.toLowerCase().trim();
                const existingShopMatch = customShoppingItems.find(
                    si => si.name && si.name.toLowerCase().trim() === cleanItemName
                );

                // Elegendő készlet vizsgálata: min > 0 esetén newQty >= min, egyébként newQty >= 1
                const hasEnough = itemMin > 0 ? (newQty >= itemMin) : (newQty >= 1);

                if (!hasEnough && item.autoShopping !== false) {
                    if (!existingShopMatch) {
                        await db.collection('spajz_custom_shopping').add({
                            name: item.name,
                            qty: Math.max(1, itemMin > 0 ? (itemMin - newQty) : 1),
                            unit: item.unit || 'db',
                            storage: item.storage || 'Kamra',
                            category: item.category || 'Alapanyag',
                            listId: 'default',
                            timestamp: Date.now()
                        });
                    }
                } else if (hasEnough) {
                    // Ha annyi van mint a minimum/készlet vagy több, azonnal eltávolítjuk a listáról!
                    if (existingShopMatch) {
                        await db.collection('spajz_custom_shopping').doc(existingShopMatch.id).delete();
                    }
                }

                await db.collection('spajz_items').doc(id).update({ qty: newQty });
            };

            const deletePantryItem = async (id, name) => {
                if (confirm(`Biztosan törölni szeretnéd ezt a tételt: ${name}?`)) {
                    recordActionForUndo();
                    await db.collection('spajz_items').doc(id).delete();
                    await db.collection('spajz_logs').add({ 
                        text: `Törölve a spájzból: ${name}`, 
                        date: new Date().toLocaleDateString(), 
                        timestamp: Date.now() 
                    });
                }
            };

            const removeCustomShopping = async (id) => {
                await db.collection('spajz_custom_shopping').doc(id).delete();
            };

            const todayStr = new Date().toISOString().split('T')[0];

            const maxQtyInPantry = Math.max(...items.map(i => Number(i.qty) || 0), 1);
            const categoryCounts = items.reduce((acc, curr) => {
                const cat = curr.category || 'Egyéb';

                                    ) : (
                                        Object.entries(categoryCounts).map(([cat, qty]) => {
                                            const catPercentage = totalItemCount > 0 ? Math.round((qty / totalItemCount) * 100) : 0;
                                            return (
                                                <div key={cat} className={`flex justify-between items-center py-1 border-b ${darkMode ? 'border-gray-800' : 'border-gray-50'}`}>
                                                    <span className={`font-medium ${darkMode ? 'text-gray-300' : 'text-gray-700'}`}>{cat}</span>
                                                    <div className="flex items-center gap-2">
                                                        <span className="text-gray-500">{qty} egység</span>
                                                        <span className="bg-emerald-500/20 text-emerald-400 px-2 py-0.5 rounded-full text-[10px] font-bold">{catPercentage}%</span>
                                                    </div>
                                                </div>
                                            );
                                        })
                                    )}
                                </div>

                                <div className={`p-4 rounded-2xl shadow-sm border ${cardBg}`}>
                                    <h2 className="font-bold text-sm mb-3 text-emerald-600">📝 Eseménynapló</h2>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {logs.length === 0 ? (
                                            <p className={`text-xs ${subText}`}>Még nincs rögzített naplóbejegyzés.</p>
                                        ) : (
                                            logs.map(log => (
                                                <div key={log.id} className={`p-2.5 rounded-xl text-xs flex justify-between items-center border ${darkMode ? 'bg-gray-800 border-gray-700' : 'bg-gray-50 border-gray-100'}`}>
                                                    <span>{log.text}</span>
                                                    <span className="text-gray-500 text-[10px]">{log.date}</span>
                                                </div>
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Navigációs sáv */}
                    <nav className={`fixed bottom-0 left-0 right-0 border-t py-2.5 px-4 flex justify-around items-center max-w-md md:max-w-4xl lg:max-w-5xl mx-auto shadow-lg rounded-t-2xl ${navBg}`}>
                        <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center text-xs font-medium ${activeTab === 'inventory' ? 'text-emerald-500' : 'text-gray-500'}`}>
                            <span>📦 Spájz</span>
                        </button>
                        <button onClick={() => setActiveTab('shopping')} className={`flex flex-col items-center text-xs font-medium relative ${activeTab === 'shopping' ? 'text-emerald-500' : 'text-gray-500'}`}>
                            <span>🛒 Lista</span>
                            {customShoppingItems.length > 0 && (
                                <span className="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">
                                    {customShoppingItems.length}
                                </span>
                            )}
                        </button>
                        <button onClick={() => setActiveTab('add')} className={`flex flex-col items-center text-xs font-medium ${activeTab === 'add' ? 'text-emerald-500' : 'text-gray-500'}`}>
                            <span>➕ Új tétel</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center text-xs font-medium ${activeTab === 'stats' ? 'text-emerald-500' : 'text-gray-500'}`}>
                            <span>📊 Grafikon</span>
                        </button>
                    </nav>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
